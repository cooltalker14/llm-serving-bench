# Full config: A100 40GB on Narval. Produces the headline numbers in the README.
# Expect ~45-70 min per sweep depending on quantization.
server:
  base_url: "http://127.0.0.1:8000"
  model: "qwen7b"

workload:
  n_prompts: 256
  prompt_tokens: 1024
  max_tokens: 256
  seed: 0

sweep:
  concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
  requests_per_worker: 6
  min_requests: 64
  warmup: 16
